{% extends "base.html" %}{% block content %}<h2>Receipt {{ receipt.id }}</h2><p>Total: {{ receipt.purchase_total }} · Date: {{ receipt.purchase_date }}</p><table><thead><tr><th>Item</th><th>Price</th></tr></thead><tbody>{% for item in receipt_items %}<tr><td><a href="/heartleaf/receipts/{{ receipt.id }}/{{ item.id }}/item">{{ item.label }}</a></td><td>{{ item.price }}</td></tr>{% endfor %}</tbody></table>{% endblock %}
